version: '3.8'

services:
  # ========================================================================
  # INFLUXDB - Base de datos de series temporales
  # ========================================================================
  influxdb:
    image: influxdb:1.8
    container_name: ubiquiti-influxdb
    ports:
      - "8086:8086"
      - "8083:8083"
    environment:
      INFLUXDB_DB: ${INFLUXDB_DATABASE}
      INFLUXDB_ADMIN_USER: ${INFLUXDB_ADMIN_USER}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - influxdb_data:/var/lib/influxdb
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================================================
  # UBIQUITI BACKEND - Colector de datos
  # ========================================================================
  ubiquiti-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubiquiti-monitor
    environment:
      INFLUXDB_HOST: ${INFLUXDB_HOST}
      INFLUXDB_PORT: ${INFLUXDB_PORT}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE}
      INFLUXDB_ADMIN_USER: ${INFLUXDB_ADMIN_USER}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      UBIQUITI_API_TOKEN: ${UBIQUITI_API_TOKEN}
      UBIQUITI_API_URL: ${UBIQUITI_API_URL}
      POLLING_INTERVAL: ${POLLING_INTERVAL}
    volumes:
      - ./logs:/app/logs
      - ./config.py:/app/config.py:ro
    networks:
      - monitoring
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================================
  # DASHBOARD - API Flask + React (reemplaza Grafana)
  # ========================================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ubiquiti-dashboard
    ports:
      - "${DASHBOARD_PORT:-5000}:5000"
    environment:
      INFLUXDB_HOST: ${INFLUXDB_HOST}
      INFLUXDB_PORT: ${INFLUXDB_PORT}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE}
      INFLUXDB_ADMIN_USER: ${INFLUXDB_ADMIN_USER}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DASHBOARD_PORT: "5000"
      SECRET_KEY: ${SECRET_KEY}
      DASHBOARD_USER: ${DASHBOARD_USER}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - ./data:/app/data
    networks:
      - monitoring
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  # ========================================================================
  # TELEGRAM NOTIFIER - Alertas de juntas caidas
  # ========================================================================
  telegram-notifier:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    container_name: ubiquiti-telegram
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_CHECK_INTERVAL: ${TELEGRAM_CHECK_INTERVAL:-300}
      DASHBOARD_API_URL: http://dashboard:5000
      DASHBOARD_USER: ${DASHBOARD_USER}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - ./data:/app/data
    networks:
      - monitoring
    depends_on:
      - dashboard
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  influxdb_data:
